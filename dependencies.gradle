ext {
    gradleBomDependencyVersions = [
            'asm.version'                   : '9.10.1',
            'gradle-spock.version'          : '2.4-groovy-4.0',
            'grails-publish-plugin.version' : '1.0.0-RC2',
            'spring-boot.version'           : '4.1.1',
    ]

    gradleBomDependencies = [
            'grails-publish-plugin': "org.apache.grails.gradle:grails-publish:${gradleBomDependencyVersions['grails-publish-plugin.version']}",
    ]

    micronautBomVersions = [
            'asm.version'     : '9.10.1',
            'groovy.version'  : '5.1.3',
            'protobuf.version': '4.30.2',
            'spock.version'   : '2.4-groovy-5.0',
    ]

    micronautBomDependencies = [
            'asm'          : "org.ow2.asm:asm:${micronautBomVersions['asm.version']}",
            'asm-util'     : "org.ow2.asm:asm-util:${micronautBomVersions['asm.version']}",
            'groovy'       : "org.apache.groovy:groovy:${micronautBomVersions['groovy.version']}",
            'protobuf-java': "com.google.protobuf:protobuf-java:${micronautBomVersions['protobuf.version']}",
            'spock-core'   : "org.spockframework:spock-core:${micronautBomVersions['spock.version']}",
            'spock-spring' : "org.spockframework:spock-spring:${micronautBomVersions['spock.version']}",
    ]
}
