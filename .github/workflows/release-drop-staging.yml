name: Release - Drop Nexus Staging
on:
  workflow_dispatch:
    inputs:
      staging_repository_id:
        description: 'Unpromoted staging repository ID (e.g. orgapachegrails-1000)'
        required: true
        type: string
permissions: {}
jobs:
  drop:
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Drop staging repository
        env:
          STAGING_REPOSITORY_ID: ${{ inputs.staging_repository_id }}
          NEXUS_STAGE_DEPLOYER_USER: ${{ secrets.NEXUS_STAGE_DEPLOYER_USER }}
          NEXUS_STAGE_DEPLOYER_PW: ${{ secrets.NEXUS_STAGE_DEPLOYER_PW }}
          STAGING_PROFILE_ID: ${{ secrets.STAGING_PROFILE_ID }}
        run: .github/scripts/dropStaging.sh --id "$STAGING_REPOSITORY_ID"
