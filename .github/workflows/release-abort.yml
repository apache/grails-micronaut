name: Release - Abort Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Unpromoted pre-release tag (e.g. v8.0.0)'
        required: true
        type: string
permissions: {}
jobs:
  abort:
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate unpromoted candidate
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(M|RC)[0-9]+)?$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' | grep -qx true
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Checkout trusted operational scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Refuse to abort a promoted version
        run: |
          for url in \
            "https://repository.apache.org/content/repositories/releases/org/apache/grails/grails-micronaut/$VERSION/" \
            "https://dist.apache.org/repos/dist/release/grails/micronaut/$VERSION/"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
            if [[ "$code" != 404 ]]; then
              echo "$url returned HTTP $code. $VERSION may already be promoted; aborting nothing." >&2
              exit 1
            fi
          done
      - name: Cancel this candidate's release runs and wait for them to stop
        run: |
          active() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$TAG" --limit 100 --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId'
          }
          active > run-ids.txt
          while read -r id; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel"
          done < run-ids.txt
          for _ in $(seq 1 90); do
            remaining=$(active)
            if [[ -z "$remaining" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Release runs are still active after 15 minutes. No cleanup was performed.' >&2
          exit 1
      - name: Drop candidate staging repository
        env:
          NEXUS_STAGE_DEPLOYER_USER: ${{ secrets.NEXUS_STAGE_DEPLOYER_USER }}
          NEXUS_STAGE_DEPLOYER_PW: ${{ secrets.NEXUS_STAGE_DEPLOYER_PW }}
          STAGING_PROFILE_ID: ${{ secrets.STAGING_PROFILE_ID }}
        run: .github/scripts/dropStaging.sh --description "${GITHUB_REPOSITORY##*/}:$VERSION"
      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion subversion-tools
      - name: Remove only Micronaut development artifacts
        env:
          SVN_USERNAME: ${{ secrets.SVC_DIST_GRAILS_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVC_DIST_GRAILS_PASSWORD }}
        run: |
          url="https://dist.apache.org/repos/dist/dev/grails/micronaut/$VERSION"
          status() { curl -sS -o /dev/null -w '%{http_code}' "$url/"; }
          code=$(status)
          case "$code" in
            200)
              svnmucc --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --non-interactive \
                -m "Remove Grails Micronaut dev version $VERSION" rm "$url"
              code=$(status)
              if [[ "$code" != 404 ]]; then
                echo "$url returned HTTP $code after removal." >&2
                exit 1
              fi
              ;;
            404) echo "No development artifacts at $url." ;;
            *) echo "$url returned HTTP $code. Not deleting the release or tag." >&2; exit 1 ;;
          esac
      - name: Remove candidate release and tag
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          echo 'Reply [CANCEL][VOTE] to the vote thread if one was opened. Check that no pending Release run remains.'
