buildscript {
    apply from: rootProject.layout.projectDirectory.file('dependencies.gradle')
}

plugins {
    id 'java-platform'
    id 'org.apache.grails.buildsrc.publish'
    id 'org.apache.grails.buildsrc.sbom'
}

apply from: rootProject.layout.projectDirectory.file('gradle/flatten-platform-constraints.gradle')

version = projectVersion
group = 'org.apache.grails'

javaPlatform {
    allowDependencies()
}

Set<String> overriddenCoordinates = micronautBomDependencies.values().collect { String coordinate ->
    List<String> parts = coordinate.split(':') as List<String>
    "${parts[0]}:${parts[1]}" as String
} as Set<String>

flattenPublishedPlatformConstraints("org.apache.grails:grails-base-bom:$projectVersion", overriddenCoordinates)
flattenPublishedPlatformConstraints("org.apache.grails:grails-hibernate5-bom:$projectVersion", overriddenCoordinates)

dependencies {
    api platform(project(':grails-micronaut-bom'))
    api(platform("org.apache.grails:grails-hibernate5-bom:$projectVersion")) {
        overriddenCoordinates.each { String coordinate ->
            List<String> parts = coordinate.split(':') as List<String>
            exclude group: parts[0], module: parts[1]
        }
    }
    constraints {
        api "io.micronaut.platform:micronaut-platform:$micronautPlatformVersion"
        micronautBomDependencies.values().each { String coordinate ->
            List<String> parts = coordinate.split(':') as List<String>
            api("${parts[0]}:${parts[1]}") {
                version {
                    strictly parts[2]
                }
            }
        }
        api "org.apache.grails:grails-data-hibernate5:$projectVersion"
    }
}

ext.pomDescription = 'Grails Hibernate 5 Micronaut BOM for Grails projects integrating Micronaut and Hibernate 5.'
