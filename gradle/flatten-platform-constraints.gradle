import groovy.xml.XmlSlurper

ext.flattenPublishedPlatformConstraints = { String platformCoordinate, Set<String> excludedCoordinates = [] ->
    List<String> platformParts = platformCoordinate.split(':') as List<String>
    String platformKey = "${platformParts[0]}:${platformParts[1]}"
    File pomFile = configurations.detachedConfiguration(dependencies.create("${platformCoordinate}@pom")).singleFile
    def pom = new XmlSlurper().parse(pomFile)
    Map<String, String> properties = [
            'project.version': platformParts[2],
            'pom.version'    : platformParts[2],
    ]
    pom.properties.children().each { property ->
        properties[property.name()] = property.text().trim()
    }

    Closure<String> resolveProperties
    resolveProperties = { String value ->
        String resolved = value
        10.times {
            String expanded = resolved.replaceAll(/\$\{([^}]+)\}/) { String match, String propertyName ->
                properties.get(propertyName, match)
            }
            if (expanded == resolved) {
                return resolved
            }
            resolved = expanded
        }
        resolved
    }

    Map<String, String> publishedConstraints = new TreeMap<>()
    pom.dependencyManagement.dependencies.dependency.each { dependency ->
        String group = resolveProperties(dependency.groupId.text().trim())
        String module = resolveProperties(dependency.artifactId.text().trim())
        String resolvedVersion = resolveProperties(dependency.version.text().trim())
        String key = "${group}:${module}"
        if (key != platformKey && !(key in excludedCoordinates)) {
            if (!resolvedVersion || resolvedVersion.contains('${')) {
                throw new GradleException("Published platform ${platformCoordinate} has an unresolved version for ${key}: ${resolvedVersion}")
            }
            publishedConstraints[key] = resolvedVersion
        }
    }

    if (publishedConstraints.isEmpty()) {
        throw new GradleException("Published platform ${platformCoordinate} did not expose any dependency constraints")
    }

    publishedConstraints.each { String key, String resolvedVersion ->
        dependencies.constraints.add('api', "${key}:${resolvedVersion}")
    }
}
