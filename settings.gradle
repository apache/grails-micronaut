import org.apache.tools.ant.DirectoryScanner

pluginManagement {
    includeBuild('./build-logic') {
        name = 'build-logic-root'
    }
    apply from: file('gradle/plugin-repositories.gradle')
    repositories {
        configurePluginRepositories(delegate)
    }
    plugins {
        def grailsVersion = providers.gradleProperty('grailsVersion').get()
        id 'org.apache.grails.gradle.grails-gsp' version grailsVersion
        id 'org.apache.grails.gradle.grails-plugin' version grailsVersion
        id 'org.apache.grails.gradle.grails-web' version grailsVersion
        id 'cloud.wondrify.asset-pipeline' version '5.2.0'
        id 'org.nosphere.apache.rat' version '0.8.1'
    }
}

plugins {
    id 'com.gradle.develocity' version '4.5.0'
    id 'com.gradle.common-custom-user-data-gradle-plugin' version '2.4.0'
    id 'org.apache.grails.buildsrc.repo'
}

def isCI = System.getenv().containsKey('CI')
def isLocal = !isCI
def isReproducibleBuild = System.getenv('SOURCE_DATE_EPOCH') != null

develocity {
    server = 'https://develocity.apache.org'
    buildScan {
        tag('grails')
        tag('grails-micronaut')
        publishing.onlyIf { it.authenticated }
        uploadInBackground = isLocal
    }
}

buildCache {
    local { enabled = (isLocal && !isReproducibleBuild) || (isCI && isReproducibleBuild) }
    remote(develocity.buildCache) {
        push = isCI
        enabled = !isReproducibleBuild
    }
}

rootProject.name = 'grails-micronaut'

include(
        'grails-micronaut-bom',
        'grails-hibernate5-micronaut-bom',
        'grails-hibernate7-micronaut-bom',
        'grails-micronaut',
        'grails-test-examples-issue-11767',
        'grails-test-examples-micronaut',
        'grails-test-examples-micronaut-groovy-only',
        'grails-test-examples-micronaut-hibernate5',
        'grails-test-examples-micronaut-hibernate7',
        'grails-test-examples-plugins-issue-11767',
        'grails-test-examples-plugins-micronaut-singleton',
)

project(':grails-micronaut-bom').projectDir = file('grails-bom/micronaut')
project(':grails-hibernate5-micronaut-bom').projectDir = file('grails-bom/hibernate5-micronaut')
project(':grails-hibernate7-micronaut-bom').projectDir = file('grails-bom/hibernate7-micronaut')
project(':grails-test-examples-issue-11767').projectDir = file('grails-test-examples/issue-11767')
project(':grails-test-examples-micronaut').projectDir = file('grails-test-examples/micronaut')
project(':grails-test-examples-micronaut-groovy-only').projectDir = file('grails-test-examples/micronaut-groovy-only')
project(':grails-test-examples-micronaut-hibernate5').projectDir = file('grails-test-examples/micronaut-hibernate5')
project(':grails-test-examples-micronaut-hibernate7').projectDir = file('grails-test-examples/micronaut-hibernate7')
project(':grails-test-examples-plugins-issue-11767').projectDir = file('grails-test-examples/plugins/issue-11767')
project(':grails-test-examples-plugins-micronaut-singleton').projectDir = file('grails-test-examples/plugins/micronaut-singleton')

for (String pattern in DirectoryScanner.defaultExcludes) {
    if (pattern.contains('gitignore') || pattern.contains('gitattributes')) {
        DirectoryScanner.removeDefaultExclude(pattern)
    }
}
