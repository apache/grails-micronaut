projectVersion=8.0.0
# Released Grails line consumed by the Gradle plugins and imported BOMs.
# Kept separate from projectVersion so snapshot builds resolve Grails 8.0.0
# rather than a Grails snapshot. -PprojectVersion overrides only this repository.
grailsVersion=8.0.0
javaVersion=25
githubBranch=8.0.x
githubSlug=apache/grails-micronaut

gradleToolingApiVersion=9.8.0
micronautPlatformVersion=5.0.3
ersatzVersion=4.0.1

apacheRatVersion=0.8.1
gradleChecksumPluginVersion=1.4.0
gradleCycloneDxPluginVersion=3.0.0
sonatypeScanPluginVersion=3.1.6
spotbugsPluginVersion=6.4.8

org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx5G
